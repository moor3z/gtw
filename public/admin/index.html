<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex, nofollow">

<body class="admin">
<header class="admin-head"><div class="wrap">

  <div class="admin-tabs" role="tablist" aria-label="Admin sections">

</div></header>
